name: doc2md consumer tests
on:
  push:
    branches:
      - main
      - feature/optional-shared-conversion
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test requirements
        run: |
          python -m pip install -e .
          python -m pip install 'pytest>=8,<10'
      - name: Run legacy and adapter regression tests
        run: python -m pytest tests -q
